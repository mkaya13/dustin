# The offline tier on every push to main and every pull request (story E0-S3), and the plan-only web
# demo (story E5-S1). No job reads a secret; the testnet tier is the separate, manual testnet.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline tier (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the engines floor of package.json (Epic 4 review, D-12).
        node: ["22.12.0", "22", "24"]
    steps:
      # actions/checkout v7.0.1; the job token is not kept on disk while install scripts run (D-11).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: No secret seed in the tracked tree
        # A standalone 56-character S... seed fails the job and prints file names only; a git grep
        # error (exit 2 and above) fails it too (E2 integration review, decision 3).
        run: |
          set +e
          git grep -l -P '(?<![A-Z2-7])S[A-Z2-7]{55}(?![A-Z2-7])'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then echo "::error::A Stellar secret seed is committed in the files above."; exit 1; fi
          if [ "$status" -ne 1 ]; then echo "::error::git grep failed with exit $status."; exit 1; fi
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # The examples import the built package, so they are checked after the build.
      - run: npm run typecheck:examples
      - run: npm test
      - run: npm run check:package
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Build the SDK the page aliases
        run: npm ci && npm run build
      - name: The SDK entry is browser-safe
        run: node scripts/check-browser-safe.mjs
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run check:bundle
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Install Chromium for Playwright
        # Bounded: an apt mirror once held this step for nineteen minutes (E5-S1 review, W7).
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Playwright smoke test on the built page
        run: npx playwright test
        working-directory: web
      # actions/upload-artifact v7.0.1: the report and traces of a failed run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
