# The live testnet tier, on demand only (story E0-S3). It needs no secret: every run funds its own
# throwaway accounts from Friendbot (ADR-0005, "Fresh fixture per run").
name: Testnet tier

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testnet
  cancel-in-progress: false

jobs:
  testnet:
    name: Testnet tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1; the job token is not kept on disk while install scripts run (D-11).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run the testnet tier
        run: npm run test:testnet
        env:
          DUSTIN_TESTNET: "1"
